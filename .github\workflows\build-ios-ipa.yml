name: Build SmartGrade Scanner (unsigned)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  DEVELOPER_NAME: "Yousef Yousef"
  TEAM_NAME: "Yousef Yousef"
  SCHEME: "SmartGradeScanner"
  PROJECT: "SmartGradeScanner.xcodeproj"
  APP_NAME: "SmartGradeScanner"
  BUNDLE_IDENTIFIER: "com.smartgrade.scanner"

jobs:
  build-unsigned:
    name: Build unsigned iOS app
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show build environment
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          echo "Developer: ${DEVELOPER_NAME}"
          echo "Team name: ${TEAM_NAME}"
          echo "Signing: disabled"

      - name: Validate project files
        shell: bash
        run: |
          set -euo pipefail
          test -f "${PROJECT}/project.pbxproj"
          test -f "${PROJECT}/xcshareddata/xcschemes/${SCHEME}.xcscheme"
          test -f "SmartGradeScanner/Resources/Info.plist"
          test -f "SmartGradeScanner/Resources/PrivacyInfo.xcprivacy"
          xcodebuild -list -project "${PROJECT}"

      - name: Run unit tests without code signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tee test.log

      - name: Build unsigned app for iOS device SDK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild build \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER="${BUNDLE_IDENTIFIER}" \
            | tee build.log

      - name: Locate and verify unsigned app
        id: locate-app
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products -type d -name "${APP_NAME}.app" -path '*Release-iphoneos*' -print -quit)"
          if [[ -z "${APP_PATH}" ]]; then
            echo 'Unsigned .app was not produced.' >&2
            find build -maxdepth 8 -print >&2
            exit 1
          fi

          if [[ -e "${APP_PATH}/_CodeSignature" ]]; then
            echo 'The app unexpectedly contains a code signature.' >&2
            exit 1
          fi

          mkdir -p artifacts/Payload
          cp -R "${APP_PATH}" artifacts/Payload/
          echo "app_path=${APP_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Package unsigned IPA and app archive
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          zip -qry "../SmartGradeScanner-unsigned.app.zip" Payload
          zip -qry "../SmartGradeScanner-unsigned.ipa" Payload
          cd ..

          cat > artifacts/BUILD-METADATA.txt <<EOF
          Application: SmartGrade Scanner
          Bundle identifier: ${BUNDLE_IDENTIFIER}
          Developer: ${DEVELOPER_NAME}
          Team name: ${TEAM_NAME}
          Signing: disabled
          Code signing identity: none
          Provisioning profile: none
          Distribution status: unsigned; not installable on a normal iPhone/iPad
          Build scheme: ${SCHEME}
          Xcode: $(xcodebuild -version | tr '\n' ' ')
          EOF

      - name: Upload unsigned app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmartGrade-Scanner-unsigned-${{ github.sha }}
          if-no-files-found: error
          path: |
            SmartGradeScanner-unsigned.ipa
            SmartGradeScanner-unsigned.app.zip
            artifacts/BUILD-METADATA.txt
            artifacts/Payload/${{ env.APP_NAME }}.app
            build.log
            test.log
