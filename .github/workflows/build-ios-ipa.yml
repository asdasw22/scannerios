name: Build SmartGradeScanner unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  DEVELOPER_NAME: "Yousef Yousef"
  TEAM_NAME: "Yousef Yousef"
  PROJECT: "SmartGradeScanner.xcodeproj"
  SCHEME: "SmartGradeScanner"
  APP_NAME: "SmartGradeScanner"
  BUNDLE_IDENTIFIER: "com.smartgrade.scanner"

jobs:
  build-ios-unsigned:
    name: Build unsigned iOS application
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Validate project files and shared iOS scheme
        shell: bash
        run: |
          set -euo pipefail

          test -f "${PROJECT}/project.pbxproj"
          test -f "${PROJECT}/xcshareddata/xcschemes/${SCHEME}.xcscheme"
          test -f "SmartGradeScanner/Resources/Info.plist"
          test -f "SmartGradeScanner/Resources/PrivacyInfo.xcprivacy"

          grep -q 'BlueprintName="SmartGradeScanner"' "${PROJECT}/xcshareddata/xcschemes/${SCHEME}.xcscheme"
          grep -q 'productType = "com.apple.product-type.application"' "${PROJECT}/project.pbxproj"
          grep -q 'SUPPORTED_PLATFORMS = "iphoneos iphonesimulator"' "${PROJECT}/project.pbxproj"
          grep -q 'SDKROOT = iphoneos' "${PROJECT}/project.pbxproj"
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 17.0' "${PROJECT}/project.pbxproj"
          grep -q 'TARGETED_DEVICE_FAMILY = "1,2"' "${PROJECT}/project.pbxproj"

          xcodebuild -list -project "${PROJECT}"

      - name: List available iOS Simulator devices
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available

      - name: Run unit tests without code signing
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project SmartGradeScanner.xcodeproj \
            -scheme SmartGradeScanner \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tee test.log

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -o pipefail
          rm -rf build artifacts SmartGradeScanner-unsigned.ipa SmartGradeScanner-unsigned.app.zip

          xcodebuild build \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER="${BUNDLE_IDENTIFIER}" \
            | tee build.log

      - name: Locate and verify unsigned app
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find build/DerivedData/Build/Products -type d -path '*Release-iphoneos/*.app' -name "${APP_NAME}.app" -print -quit)"
          if [[ -z "${APP_PATH}" ]]; then
            echo 'The unsigned app was not produced.' >&2
            find build -maxdepth 8 -print >&2
            exit 1
          fi

          test ! -e "${APP_PATH}/_CodeSignature"
          test ! -e "${APP_PATH}/embedded.mobileprovision"

          mkdir -p artifacts/Payload
          cp -R "${APP_PATH}" artifacts/Payload/

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          test -d "artifacts/Payload/${APP_NAME}.app"
          ditto -c -k --sequesterRsrc --keepParent artifacts/Payload SmartGradeScanner-unsigned.ipa
          ditto -c -k --sequesterRsrc --keepParent "artifacts/Payload/${APP_NAME}.app" SmartGradeScanner-unsigned.app.zip

          cat > artifacts/BUILD-METADATA.txt <<EOF
          Application: SmartGrade Scanner
          Bundle identifier: ${BUNDLE_IDENTIFIER}
          Developer: ${DEVELOPER_NAME}
          Team name: ${TEAM_NAME}
          Scheme: ${SCHEME}
          Supported platforms: iphoneos iphonesimulator
          Signing: disabled
          Code signing identity: none
          Development team ID: none
          Provisioning profile: none
          Distribution status: unsigned; not installable on a normal iPhone or iPad
          EOF

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartGradeScanner-unsigned-${{ github.sha }}
          if-no-files-found: error
          path: |
            SmartGradeScanner-unsigned.ipa
            SmartGradeScanner-unsigned.app.zip
            artifacts/BUILD-METADATA.txt
            artifacts/Payload/${{ env.APP_NAME }}.app
            build.log
            test.log
